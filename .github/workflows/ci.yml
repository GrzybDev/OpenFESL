name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: GrzybDev/actions/.github/workflows/python-checks.yml@v1
    with:
      test-command: pytest
      mypy: true

  imports:
    name: Check the layer imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tags.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.14'

      - run: uv run --locked lint-imports

  # Dokploy builds the deployed image from this Dockerfile on the server.
  image:
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker build --tag openfesl .

      - name: Check that the server starts and answers its health check
        run: |
          docker network create openfesl
          docker run --detach --name database --network openfesl \
            --env POSTGRES_PASSWORD=openfesl postgres:18-alpine
          # Over TCP: the image's first-start server listens on its socket only, then restarts.
          until docker exec database pg_isready --host 127.0.0.1 --username postgres; do
            sleep 1
          done
          docker run --detach --name openfesl --network openfesl \
            --env DATABASE_URL=postgresql+asyncpg://postgres:openfesl@database/postgres openfesl
          for _ in $(seq 1 30); do
            if docker exec openfesl python -m openfesl.server.health; then
              exit 0
            fi
            sleep 1
          done
          docker logs openfesl
          exit 1
