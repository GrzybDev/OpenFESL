name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: GrzybDev/actions/.github/workflows/python-checks.yml@v1
    with:
      test-command: pytest
      mypy: true

  imports:
    name: Check the layer imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tags.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.14'

      - run: uv run --locked lint-imports

  # Dokploy builds the deployed image from this Dockerfile on the server.
  image:
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker build --tag openfesl .

      - name: Check that the server starts and answers its health check
        run: |
          docker run --detach --name openfesl openfesl
          for _ in $(seq 1 20); do
            if docker exec openfesl openfesl health; then
              exit 0
            fi
            sleep 1
          done
          docker logs openfesl
          exit 1
