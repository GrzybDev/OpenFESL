[project]
name = "openfesl"
version = "0.1.0"
description = "Master server for games built on EA's FESL and Theater services, reached through OpenFESLHook"
authors = [
    {name = "Marek Grzyb", email = "marek@grzyb.dev"}
]
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE.md",
    "THIRD-PARTY-NOTICES.md",
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "babel>=2.18.0",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "jinjax>=0.66",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
openfesl = "openfesl.server.cli:main"

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "djlint>=1.47.0",
    "hypothesis>=6.170.9",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "testcontainers>=4.15.0",
    "websockets>=17.3",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PTH", "RUF", "D"]
# Modules, packages, types and magic methods carry a summary only where their name needs one
ignore = ["D100", "D101", "D104", "D105", "D106"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# Alembic's environment and revisions follow Alembic's own layout.
"src/openfesl/storage/migrations/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
pythonpath = ["tests"]

[tool.mypy]
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.importlinter]
root_package = "openfesl"

[[tool.importlinter.contracts]]
name = "Each layer imports only the layers below it"
type = "layers"
layers = [
    "openfesl.server",
    "openfesl.relay | openfesl.web | openfesl.storage",
    "openfesl.core",
    "openfesl.protocol",
]

[tool.djlint]
profile = "jinja"
extension = "jinja"
indent = 2
max_line_length = 120
preserve_blank_lines = true
# The JinjaX components that hold blocks of a page, indented as HTML's blocks are; the others stay
# inline like spans.
custom_html = "Layout,Panel,PageHead,Notice,Player,Stat,Fact"
