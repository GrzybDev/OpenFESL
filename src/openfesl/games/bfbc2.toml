name = "Battlefield: Bad Company 2"
# The game's executable, next to which OpenFESLHook goes.
executable = "BFBC2Game.exe"
partition = "/eagames/BFBC2"
namespace = "battlefield"
provider_attribute = "B-U-Provider"
# The entitlements dedicated servers may grant the players in their games, such as
# { tag = "...", group = "..." }. Public R34 servers ask for those the game marks automatic,
# which are not known, so none is listed.
automatic_grants = []

[clients.bfbc2-pc]
theater_port = 18395
entitlement = "bfbc2-pc"

[clients.bfbc2-pc-server]
theater_port = 18326
server_account = "bfbc2.server.pc@ea.com"

# How the services behave where the game handles more than one behaviour; the instance's
# settings override each.
[policies]
# A birth date is checked against the country's age limits below (or: false).
registration.age_check = true
# A player old enough to register but not without a parent's consent registers, since the PC
# game has no form for a parent's e-mail (or: refuse).
registration.under_parental_age = "allow"
# A new account logs in only once the link sent to its address was opened (or: true).
accounts.email_verification = false
# A login while the account plays elsewhere signs the other game out (or: refuse).
accounts.concurrent_login = "replace"
# The oldest client version that may connect, such as "1.0"; older ones are told to update.
connect.minimum_client_version = ""
# The oldest OpenFESLHook version that may connect, such as "0.2.0"; older hooks and those
# that name no version are told to update.
connect.minimum_hook_version = ""
# Whether players are told that the service is busy; dedicated servers still connect.
connect.maintenance = false

# The countries whose age limits differ from 13 to register and 18 to register without a
# parent's consent.
[countries]
DE = { registration_age = 14, parental_age = 14 }
FR = { registration_age = 16, parental_age = 16 }

# The game's PC menus as the web pages draw them: their orange, condensed capitals, warm-grey
# rows and a dark olive field.
[theme]
font = "Barlow Semi Condensed"
accent = "#DA8602"
accent_hover = "#F29A12"
menu_current = "#5B5C57"
badge = "#94AC54"
badge_edge = "#2A2F14"
field = "#1A1B16"
mottle = "#CED0C2"
grit = "#F6F6EF"
panel = "rgba(83, 85, 59, 0.74)"
panel_edge = "#8C8E78"
row = "#BABAB2"
row_alt = "#B6B6AE"
row_light = "#E2E2DE"
score_row = "#D6D6D6"
score_row_alt = "#DADADA"
subtitle = "#0A0A0A"
bright = "#F4F4EE"
soft = "#D9D9CD"

# How the web pages read the games that dedicated servers host, from the attributes the R34
# dedicated server publishes. A squad holds four players.
[listing]
squad = 4
hardcore = { attribute = "B-U-type", value = "HARDCORE" }
# The message the server's operator wrote, in D-ServerDescription0 and on.
message = "D-ServerDescription"

# The level's id names the map; its modes' levels add a suffix, such as MP_005GR for Rush. The
# names are those of the game's own map list; other levels show their ids.
[listing.map]
attribute = "B-U-level"
prefix = true

[listing.map.names]
"Levels/MP_001" = "panama-canal"
"Levels/MP_002" = "valparaiso"
"Levels/MP_003" = "laguna-alta"
"Levels/MP_004" = "isla-inocentes"
"Levels/MP_005" = "atacama-desert"
"Levels/MP_006" = "arica-harbor"
"Levels/MP_007" = "white-pass"
"Levels/MP_008" = "nelson-bay"
"Levels/MP_009" = "laguna-presa"
"Levels/MP_012" = "port-valdez"
"Levels/NAM_MP_002" = "vantage-point"
"Levels/NAM_MP_003" = "hill-137"
"Levels/NAM_MP_005" = "cao-son-temple"
"Levels/NAM_MP_006" = "phu-bai-valley"
"Levels/NAM_MP_007" = "operation-hastings"

[listing.mode]
attribute = "B-U-gamemode"
names = { CONQUEST = "conquest", RUSH = "rush", SQRUSH = "squad-rush", SQDM = "squad-deathmatch" }

# The Vietnam expansion's levels name it; the others need the base game only.
[listing.expansion]
attribute = "B-U-mod"
names = { VIETNAM = "vietnam" }
otherwise = "base"

# The server's -location option, UNKNOWN without one.
[listing.region]
attribute = "B-U-location"
names = { UNKNOWN = "unknown" }

# The settings the game's server info screen shows, which the server publishes as 1 or 0, the
# friendly fire as the share of damage it does.
[listing.settings]
friendly-fire = "D-FriendlyFire"
minimap = "D-Minimap"
3d-spotting = "D-ThreeDSpotting"
auto-balance = "D-AutoBalance"
vehicle-cameras = "D-ThirdPersonVehicleCameras"
minimap-spotting = "D-MinimapSpotting"
kill-cam = "D-KillCam"
crosshair = "D-Crosshair"

# The R34 server lists up to 32 players in D-pdat00 to D-pdat31, each as name|n|n|n|n: the
# name, then four numbers of its own; the third is a share in percent. Which numbers hold what is
# not known yet, so the pages show the names only.
[listing.roster]
attribute = "D-pdat"
fields = ["name", "", "", "", ""]

# The stats the web pages show, by the keys of the game's stats template (Persistence/MP_Template
# in the game's data), which dedicated servers upload. The template derives the score from its
# score buckets.
[stats]
score = ["sc_general", "sc_team", "sc_bonus", "sc_squad", "sc_objective", "sc_award"]
kills = ["kills"]
deaths = ["deaths"]
dog_tags = ["dogt"]
time = ["time"]
# The total score each rank from 1 to 50 needs, as the game's point system
# (Awards/PointSystemParams) lists them.
ranks = [6500, 11000, 18500, 28000, 40000, 53000, 68000, 84000, 100000, 120000, 138000, 158000,
    179000, 200000, 224000, 247000, 272000, 297000, 323000, 350000, 377000, 405000, 437000,
    472000, 537000, 620000, 720000, 832000, 956000, 1090000, 1240000, 1400000, 1550000, 1730000,
    1900000, 2100000, 2300000, 2500000, 2700000, 2900000, 3140000, 3370000, 3600000, 3800000,
    4010000, 4300000, 4600000, 4900000, 5100000, 5400000]

[http]
locker = "http://easo.ea.com/fileupload/locker2.jsp"

# The game compares the version file with its own build, so it holds the last one to keep the
# updater quiet; the store lists no offers.
[http.files]
"http://easo.ea.com/easo/editorial/BF/2010/BFBC2/config/PC/version" = "bfbc2/version"
"http://easo.ea.com/easo/editorial/BF/2010/BFBC2/config/PC/game.xml" = "bfbc2/game.xml"
"http://easo.ea.com/easo/editorial/BF/2010/BFBC2/store/PC/overlay.xml" = "bfbc2/overlay.xml"

[[keys]]
code = "ACTIVATE-GAME"
entitlements = [
    { tag = "bfbc2-pc" },
    { tag = "ONLINE_ACCESS", product = "DR:156691300" },
    { tag = "BETA_ONLINE_ACCESS", product = "OFB-BFBC:19121" },
]

[[keys]]
code = "ACTIVATE-VIETNAM"
entitlements = [
    { tag = "BFBC2:PC:VIETNAM_ACCESS", group = "BFBC2PC", product = "DR:219316800" },
    { tag = "BFBC2:PC:VIETNAM_PDLC", group = "BFBC2PC", product = "DR:219316800" },
]

[[keys]]
code = "ACTIVATE-SPECACT"
entitlements = [
    { tag = "BFBC2:PC:ALLKIT", group = "BFBC2PC" },
    { tag = "BFBC2:PC:MAXALLKIT", group = "BFBC2PC" },
]

[[keys]]
code = "ACTIVATE-PREMIUM"
entitlements = [
    { tag = "BFBC2:PC:LimitedEdition", group = "BFBC2PC", product = "OFB-BFBC:19120" },
]

[[keys]]
code = "ACTIVATE-VETERAN"
entitlements = [
    { tag = "BFBC2:PC:ADDSVETRANK", group = "AddsVetRank", product = "OFB-EAST:40873" },
    { tag = "BF3:PC:ADDSVETRANK", group = "AddsVetRank", product = "OFB-EAST:40873" },
]

# The records a player's game keeps per persona: the dogtags it took, by victim persona id, of
# which it keeps at most 1000, and its clan tag.
[records]
dogtags = 1000
clan = 16

# The Plasma lists the game loads and the dedicated servers' list of players whose dogtags a
# player took, which the servers fill up to 100 for the unique dogtag awards. A player's game
# keeps its own dogtags with their details in the record above.
[associations]
PlasmaFriends = { size = 20, mutual = true, invitations = ["invite/friend"] }
PlasmaBlock = { size = 20, blocks = true }
PlasmaMute = { size = 20 }
PlasmaRecentPlayers = { size = 100 }
dogtags = { size = 100, kept_by_servers = true }

[[lobbies]]
id = 1
name = "bfbc2PC01"
locale = "en_US"
max_games = 10000
