[http]
locker = "http://easo.ea.com/fileupload/locker2.jsp"

# The game compares the version file with its own build, so it holds the last one to keep the
# updater quiet; the store lists no offers.
[http.files]
"http://easo.ea.com/easo/editorial/BF/2010/BFBC2/config/PC/version" = "bfbc2/version"
"http://easo.ea.com/easo/editorial/BF/2010/BFBC2/config/PC/game.xml" = "bfbc2/game.xml"
"http://easo.ea.com/easo/editorial/BF/2010/BFBC2/store/PC/overlay.xml" = "bfbc2/overlay.xml"

[[keys]]
code = "ACTIVATE-GAME"
entitlements = [
    { tag = "bfbc2-pc" },
    { tag = "ONLINE_ACCESS", product = "DR:156691300" },
    { tag = "BETA_ONLINE_ACCESS", product = "OFB-BFBC:19121" },
]

# The VIP code of retail boxes, whose licence the map-pack levels require.
[[keys]]
code = "ACTIVATE-VIP"
entitlements = [
    { tag = "BFBC2:PC:CIAB", group = "BFBC2PC" },
]

[[keys]]
code = "ACTIVATE-VIETNAM"
entitlements = [
    { tag = "BFBC2:PC:VIETNAM_ACCESS", group = "BFBC2PC", product = "DR:219316800" },
    { tag = "BFBC2:PC:VIETNAM_PDLC", group = "BFBC2PC", product = "DR:219316800" },
]

[[keys]]
code = "ACTIVATE-SPECACT"
entitlements = [
    { tag = "BFBC2:PC:ALLKIT", group = "BFBC2PC" },
    { tag = "BFBC2:PC:MAXALLKIT", group = "BFBC2PC" },
]

[[keys]]
code = "ACTIVATE-PREMIUM"
entitlements = [
    { tag = "BFBC2:PC:LimitedEdition", group = "BFBC2PC", product = "OFB-BFBC:19120" },
]

[[keys]]
code = "ACTIVATE-VETERAN"
entitlements = [
    { tag = "BFBC2:PC:ADDSVETRANK", group = "AddsVetRank", product = "OFB-EAST:40873" },
    { tag = "BF3:PC:ADDSVETRANK", group = "AddsVetRank", product = "OFB-EAST:40873" },
]

# The records a player's game keeps per persona: the dogtags it took, by victim persona id, of
# which it keeps at most 1000, and its clan tag.
[records]
dogtags = 1000
clan = 16

# The Plasma lists the game loads and the dedicated servers' list of players whose dogtags a
# player took, which the servers fill up to 100 for the unique dogtag awards. A player's game
# keeps its own dogtags with their details in the record above.
[associations]
PlasmaFriends = { size = 20, mutual = true, invitations = ["invite/friend"] }
PlasmaBlock = { size = 20, blocks = true }
PlasmaMute = { size = 20 }
PlasmaRecentPlayers = { size = 100 }
dogtags = { size = 100, kept_by_servers = true }

[[lobbies]]
id = 1
name = "bfbc2PC01"
locale = "en_US"
max_games = 10000
