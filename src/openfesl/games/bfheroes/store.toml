# The store's starting set: what the items of the imported catalogue sell for, which fills a store
# that has no products; the admin changes the products from there. Most items sell as the store
# last listed them (bfheroes/listing.toml); the rules below price the others and what a box gives
# of any item. The game buys a product by its id, which the original store wrote OFB-DBFH:<number>
# (the 2013-2015 site); the game puts it in a path as it is.
[store]
ids = "OFB-DBFH:{id}"
# A rental's share of the item's value in percent, by its days: 30 days were half the price of
# owning an item for good and 14 days of a weapon 37%, the plain weapons' Valor Point rentals 5%
# of 3,000 a day and 15% for 3 days; a week is inferred, below 14 days and above the 27% of a
# day of a Super weapon in Funds.
rentals = { 1 = 5, 3 = 15, 7 = 30, 14 = 37, 30 = 50 }
# A rental in Valor Points costs a multiple of 50, rounded down, as the listed weapons' do. Funds
# rentals stay exact, as half of a price that ends in 9 is the store's own price for 30 days.
rounding = { _DV = { step = 50 } }
# An item's description is the game's own text, as its script bridge's getItemDescription reads it
# (BFHeroes.exe 1.89 0x009fe31e).
descriptions = ["WEST_FE_WEAPON_DESCRIPTION_{id}", "WEST_Custom_Item_Info_{id}"]

# Never sold nor dropped: the hair, facial hair and heads a hero's look takes from its creation;
# what the loadouts hold, which the game grants every hero itself (BFHeroes.exe 1.89 0x007bae0d);
# and the partner, celebration, developer, retailer, test and mission-reward items, which the
# store did not sell alone in 2012. The clothes the definitions mark default are never sold
# either, as every hero they fit holds them.
[store.excluded]
slots = ["head", "hair", "facial_hair"]
items = [
    # The loadouts' weapons and level-1 class abilities.
    3001, 3002, 3003, 3004, 3009, 3010, 3011, 3012, 3013, 3014, 3155, 3156, 2026, 2075, 2136, 2141,
    # The loadouts' clothes and emotes.
    4, 5, 9, 10, 32, 36, 73, 444, 935, 936, 978, 979, 980, 981, 5000, 5007,
    # The lower levels of the bandage and wrench, as only the Supreme ones were on offer, and the
    # prototype widgets.
    2001, 2002, 2003, 2004, 2146, 2147, 2148, 2149, 2185, 2186, 2187,
    # Partner items: Minecraft, Battlefield 3, N7, Battlefield Play4Free medals, beta medals.
    1468, 1469, 1471, 1472, 1689, 1690, 1394, 1395, 450, 459, 928,
    # The 10-million shirts, Need for Speed items and server shirts.
    1556, 1557, 1558, 1559, 997, 1066, 1073, 1283, 1297, 1367, 1385, 1676, 1677, 1683, 1684, 1685,
    1731, 1733, 1737, 1739,
    # Retailer launchers.
    3230, 3231, 3232, 3233, 3234, 3235, 3236, 3237, 3275, 3276, 3279, 3280, 3281, 3282,
    # The Micro Blaster and Lil' Boomer, first seen in the chests of February 2013.
    3277, 3278,
    # The developers' items.
    1822, 1892, 5067, 5068,
    # Unnamed and test items.
    1122, 3018, 3188, 3189, 3216, 3222, 3223, 3243, 3244, 3344, 3345,
    # Mission rewards, the golden weapons among them.
    1511, 1512, 3205, 3206, 3209, 3211, 3090, 3091, 3092, 3093, 3094, 3097, 3251, 3252, 3253, 3254,
    3255, 3256, 3257, 3258,
]

