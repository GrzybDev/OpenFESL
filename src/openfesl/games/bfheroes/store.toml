# The store's starting set: what the items of the imported catalogue sell for, which fills a store
# that has no products; the admin changes the products from there. Prices are those of autumn 2012
# where the archived hot deals and forum posts keep them, else derived from them. The game buys a
# product by its id, which the original store wrote OFB-DBFH:<number> (the 2013-2015 site); the
# game puts it in a path as it is.
[store]
ids = "OFB-DBFH:{id}"
# A rental's share of the item's value in percent, by its days: 30 days were half the price of
# owning an item for good (emotes 140 or 280 BattleFunds, 2010), the shorter ones are inferred.
rentals = { 1 = 5, 3 = 10, 7 = 20, 30 = 50 }
# A rental in Valor Points costs a multiple of 50, rounded down; no archive shows one. Funds
# rentals stay exact, as a week of a Super weapon (672) would fall below the 629 of the class
# supply drops that promise to be worth their price if it ended in 99.
rounding = { _DV = { step = 50 } }

# Never sold nor dropped: the hair, facial hair and heads a hero's look takes from its creation;
# the weapons and class abilities of the loadouts, which the game grants every hero itself
# (BFHeroes.exe 1.89 0x007bae0d); and the partner, celebration, retailer, test and mission-reward
# items of 2012. The clothes the definitions mark default are never sold either, as every hero
# they fit holds them.
[store.excluded]
slots = ["head", "hair", "facial_hair"]
items = [
    # The loadouts' weapons and level-1 class abilities.
    3001, 3002, 3003, 3004, 3009, 3010, 3011, 3012, 3013, 3014, 3155, 3156, 2026, 2075, 2136, 2141,
    # Partner items: Minecraft, Battlefield 3, N7, Battlefield Play4Free medals, beta medals.
    1468, 1469, 1471, 1472, 1689, 1690, 1394, 1395, 450, 459, 928,
    # The 10-million shirts, Need for Speed items and server shirts.
    1556, 1557, 1558, 1559, 997, 1066, 1073, 1283, 1297, 1367, 1385, 1676, 1677, 1683, 1684, 1685,
    1731, 1733, 1737, 1739,
    # Retailer launchers.
    3230, 3231, 3232, 3233, 3234, 3235, 3236, 3237, 3275, 3276, 3277, 3278, 3279, 3280, 3281, 3282,
    # Unnamed and test items.
    3018, 3188, 3189, 3216, 3222, 3223, 3243, 3244, 3344, 3345,
    # Mission rewards.
    1511, 1512, 3205, 3206, 3209, 3211,
]

# The first rule of a currency that covers an item prices it in that currency; an item no rule
# covers, such as a mission, is not sold. Funds (_PF) are the account's, Valor Points (_DV) too,
# and Hero Points (_DH) the hero's own.

# Battlefield: Bad Company 2 class weapons: a set with its weapon cost 6,720 Funds more than the set
# alone (22,980 against 16,260), as 1,120 BattleFunds did in 2010.
[[store.prices]]
kind = "weapon"
items = [3015, 3025, 3038, 3041, 3042, 3043]
currency = "_PF"
value = 6720
sold = ["perm"]

