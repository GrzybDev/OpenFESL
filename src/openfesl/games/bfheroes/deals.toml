# The hot deals' rotation: what the store's hot deals sell besides the admin's own offers, in
# the sections of the autumn 2012 window, which the first look after a section's change makes
# and the store keeps. Each switch, size and schedule below is a default that the setting
# bfheroes.deals.<path> overrides, such as bfheroes.deals.sections.sale.enabled = off. Times are
# the zone's midnights, a period's days counted from Mondays. Set names and descriptions are
# the game's own bundle texts; prices worked out from items end in 99, as the store's did in
# 2012 (archived hot deals, HD yyyymmdd; product ids in parentheses).
[deals]
enabled = true
zone = "UTC"
currency = "_PF"
price_ending = 99

# Deal of the Day: three clothing pieces of one faction, worn in three slots, 30% off for a day
# (three pieces at -29% on 2012-08-28; single items at half price in 2010).
[deals.sections.daily]
kind = "items"
schedule = { every = 1 }
pieces = 3
slots = ["hat", "facial", "neck", "body", "jacket", "hands", "legs", "feet", "waist"]
discount = 30
name = "web.deals.daily.name"

# New sets: six sets of each faction every Monday at half their items' price, none again
# within six weeks of leaving (sets struck at a median 46% off in July 2012).
[deals.sections.new]
kind = "offers"
schedule = { every = 7 }
size = 6
discount = [50, 50]
gap = 42
sets = true

# On sale: two sets or emote pairs of each faction for 72 hours from Mondays and Thursdays, 25
# to 50% off (79 hours left on the half-price emote bundles in October 2011).
[deals.sections.sale]
kind = "offers"
schedule = { every = 7, starts = [0, 3], lasts = 3 }
size = 2
discount = [25, 50]
gap = 42
sets = true

