# What the store last listed the items for, which sells them that way alone; an item it does not
# list sells by its rule (bfheroes/store.toml). The prices are those that the fan catalogue
# bfh-info.cs-heroes.cz keeps of the store's last years, read against the struck prices of its deal
# history and of archived 2010-2013 deals, whose set totals they then equal. It shows a sale's price
# as a day's: of two such prices the higher is the permanent one, a third off the list price for
# most items, which is put back, and the lower one is of 30 days when it is half or about a third
# of the permanent one. Two cuts of later years are taken back: a third off the machine guns, and
# the 7 and 30 days in Valor Points that are leftovers of 2009, cheaper than a day; permanent
# Valor Point prices came in 2013, after the 1.89 client. A rental that costs as much as a longer
# one is left out, and an item whose permanent price the catalogue lost keeps its rule's.

