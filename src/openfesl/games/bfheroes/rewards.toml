# The rewards of the game's site, which an account claims once each: the yearly calendar of the
# original's rewards page (May 2011 to 2012), each event in a Royal and a National part that
# needs a hero of that faction and may both be claimed. A gift's items go to one hero of the
# faction chosen when claiming, its Funds and keys to the account. Each switch below is a
# default that the setting bfheroes.rewards.<path> overrides, such as bfheroes.rewards.paused =
# on or bfheroes.rewards.events.halloween.enabled = off; days start at the zone's midnight.
# Names and descriptions are the game's REWARDS_* texts where the data matches what they state,
# else the server's own (archived forum threads as tid N).
[rewards]
zone = "UTC"
currency = "_PF"
# An item a hero owns for good already turns into a pack of tonics worth about a box's price.
fallback = "2153 x150"

# Valentine's Day: the faction's rose for a week and ten gift-package traps, 13 to 15 February
# (Love Letters, keys captured from 2012-02-16; the Bundle of Love ran 14-15 February 2012).
[rewards.events.valentine]
window = { dates = ["02-13", "02-15"] }

[rewards.events.valentine.parts.royal]
faction = "royal"
name = "REWARDS_VALENTINE_ROYAL_NAME"
description = "REWARDS_VALENTINE_ROYAL_DESCRIPTION"
gift = { items = ["1127 7d", "2172 x10"] }

[rewards.events.valentine.parts.national]
faction = "national"
name = "REWARDS_VALENTINE_NATIONAL_NAME"
description = "REWARDS_VALENTINE_NATIONAL_DESCRIPTION"
gift = { items = ["1128 7d", "2171 x10"] }

# Easter, Good Friday to Easter Monday: a basket of 25 Festive Eggs and a rabbit's or bunny's
# head for three days (a basket of free eggs in 2012, tid 332474).
[rewards.events.easter]
window = { easter = [-2, 1] }

[rewards.events.easter.parts.royal]
faction = "royal"
name = "REWARDS_EASTER_ROYAL_NAME"
description = "REWARDS_EASTER_ROYAL_DESCRIPTION"
gift = { items = ["2176 x25", "1363 3d"] }

[rewards.events.easter.parts.national]
faction = "national"
name = "REWARDS_EASTER_NATIONAL_NAME"
description = "REWARDS_EASTER_NATIONAL_DESCRIPTION"
gift = { items = ["2175 x25", "1372 3d"] }

# The game's birthday, from 25 June for a week: the 2011 pack of each faction (a party hat for
# good, 25 Festive Flares, Naked Legs and Body for a week, 77 BattleFunds, tid 246271) with the
# 2012 tricycle for three days, and two treasure chest keys for the account (tid 356286). The
# game's texts name the year, so the server's own name the pack.
[rewards.events.birthday]
window = { dates = ["06-25", "07-01"] }

[rewards.events.birthday.parts.royal]
faction = "royal"
name = "web.rewards.birthday.name"
description = "web.rewards.birthday.description"
gift = { items = [1439, "2161 x25", "1000 7d", "998 7d", "5063 3d"], funds = 462 }

[rewards.events.birthday.parts.national]
faction = "national"
name = "web.rewards.birthday.name"
description = "web.rewards.birthday.description"
gift = { items = [1440, "2162 x25", "1001 7d", "999 7d", "5064 3d"], funds = 462 }

[rewards.events.birthday.parts.account]
name = "web.rewards.birthday.keys.name"
description = "web.rewards.birthday.keys.description"
gift = { keys = 2 }

# Halloween trick-or-treat, 19 to 31 October: each day one free roll of the faction's
# Trick-or-Treat bag, which the hot deals sell through the same days (daily keys 1 to 13
# captured from 21 October 2011).
[rewards.events.halloween]
window = { dates = ["10-19", "10-31"] }
daily = true

[rewards.events.halloween.parts.royal]
faction = "royal"
name = "REWARDS_HALLOWEEN_DAY_{day}_ROYAL_NAME"
description = "REWARDS_HALLOWEEN_DAY_{day}_ROYAL_DESCRIPTION"
gift = { box = "royal-trick-or-treat" }

[rewards.events.halloween.parts.national]
faction = "national"
name = "REWARDS_HALLOWEEN_DAY_{day}_NATIONAL_NAME"
description = "REWARDS_HALLOWEEN_DAY_{day}_NATIONAL_DESCRIPTION"
gift = { box = "national-trick-or-treat" }

# The Bento week of the Rising Sun, 21 to 27 November: each day one free Bento Box of the
# faction ("one free ... each day until November 27", the 2011-11-21 update, tid 284786).
[rewards.events.bento]
window = { dates = ["11-21", "11-27"] }
daily = true

[rewards.events.bento.parts.royal]
faction = "royal"
name = "REWARDS_ROYAL_BENTO_BOX_DAY_{day}_NAME"
description = "REWARDS_ROYAL_BENTO_BOX_DAY_{day}_DESCRIPTION"
gift = { box = "royal-bento-box" }

[rewards.events.bento.parts.national]
faction = "national"
name = "REWARDS_NATIONAL_BENTO_BOX_DAY_{day}_NAME"
description = "REWARDS_NATIONAL_BENTO_BOX_DAY_{day}_DESCRIPTION"
gift = { box = "national-bento-box" }

# Christmas, 1 to 24 December: Santa's Gift for Royal heroes and Nikolaus' Gift for National
# ones, each day one free roll of the faction's Visit; on the 2nd, 9th and 17th the 2011
# calendar's free one-day trials instead: the holiday set without its hat, the battle rifle,
# for a Soldier, else the day's Visit, and the pet (tid 288573, 288927).
[rewards.events.christmas]
window = { dates = ["12-01", "12-24"] }
daily = true

[rewards.events.christmas.parts.royal]
faction = "royal"
name = "REWARDS_SANTAS_GIFT_DAY_{day}_NAME"
description = "REWARDS_SANTAS_GIFT_DAY_{day}_DESCRIPTION"
gift = { box = "royal-santas-visit" }

[rewards.events.christmas.parts.royal.days]
2 = { items = ["1325 1d", "1326 1d", "1327 1d", "1328 1d", "1329 1d"] }
9 = { items = ["3212 1d"], box = "royal-santas-visit" }
17 = { items = ["1530 1d"] }

[rewards.events.christmas.parts.national]
faction = "national"
name = "REWARDS_NIKOLAUS_GIFT_DAY_{day}_NAME"
description = "REWARDS_NIKOLAUS_GIFT_DAY_{day}_DESCRIPTION"
gift = { box = "national-nikolaus-visit" }

[rewards.events.christmas.parts.national.days]
2 = { items = ["1320 1d", "1321 1d", "1322 1d", "1323 1d", "1324 1d"] }
9 = { items = ["3213 1d"], box = "national-nikolaus-visit" }
17 = { items = ["1529 1d"] }
