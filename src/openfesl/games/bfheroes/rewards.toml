# The rewards of the game's site, which an account claims once each: the yearly calendar of the
# original's rewards page (May 2011 to 2012), each event in a Royal and a National part that
# needs a hero of that faction and may both be claimed. A gift's items go to one hero of the
# faction chosen when claiming, its Funds and keys to the account. Each switch below is a
# default that the setting bfheroes.rewards.<path> overrides, such as bfheroes.rewards.paused =
# on or bfheroes.rewards.events.halloween.enabled = off; days start at the zone's midnight.
# Names and descriptions are the game's REWARDS_* texts where the data matches what they state,
# else the server's own (archived forum threads as tid N); each event's title and summary, and how
# a goal's progress reads, are the server's own.
[rewards]
zone = "UTC"
currency = "_PF"
# An item a hero owns for good already turns into a pack of tonics worth about a box's price.
fallback = "2153 x150"

# Valentine's Day: the faction's rose for a week and ten gift-package traps, 13 to 15 February
# (Love Letters, keys captured from 2012-02-16; the Bundle of Love ran 14-15 February 2012).
[rewards.events.valentine]
title = "games.bfheroes.rewards.valentine"
summary = "games.bfheroes.rewards.valentine.summary"
window = { dates = ["02-13", "02-15"] }

[rewards.events.valentine.parts.royal]
faction = "royal"
name = "REWARDS_VALENTINE_ROYAL_NAME"
description = "REWARDS_VALENTINE_ROYAL_DESCRIPTION"
gift = { items = ["1127 7d", "2172 x10"] }

[rewards.events.valentine.parts.national]
faction = "national"
name = "REWARDS_VALENTINE_NATIONAL_NAME"
description = "REWARDS_VALENTINE_NATIONAL_DESCRIPTION"
gift = { items = ["1128 7d", "2171 x10"] }

