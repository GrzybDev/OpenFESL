name = "Battlefield Heroes"
# The game's executable, next to which OpenFESLHook goes; started with +dedicated, the same
# executable is the game's dedicated server.
executable = "BFHeroes.exe"
# The game's Plasma partition and persona namespace are kept on EA's servers, not in the client,
# which only reads the partition back from the Hello answer; these are the ones the game was
# played with live on OpenFESL.
partition = "/eagames/bfwest"
namespace = "bfwest"
# The web pages the game's menu shows beside its front page: the guide to playing, the leaderboards
# of its heroes, the store and its hot deals, the treasure chests of an account's heroes, the Funds
# page, the rewards that accounts claim, the page that redeems codes, Recruit a Friend, the Daily
# Claw, their friends and the player search. The server list is drawn for games with squads and a
# server browser that finds servers by name, and the leaderboard of players for other stats than
# this game's, so neither is listed.
pages = [
    "play",
    "leaderboards",
    "store",
    "hot-deals",
    "treasure-chests",
    "funds",
    "rewards",
    "redeem",
    "recruit-a-friend",
    "claw",
    "friends",
    "search",
]
# The stats of the player's account rather than of a hero: the tutorial, the last session and its
# length, the daily missions and the pop-item counts. The game's stats dictionary gives each key its
# owner, yet it names a hero and an account by the same owner type, telling them apart by the id
# alone (BFHeroes.exe 1.89 0x006aa1fb).
account_stats = ["c_tut", "c_ltm", "c_slm", "cdm", "edm", "dmc", "pi[0-9]+"]
# The parts of the game's data kept in files of their own: the store's starting set, the hot
# deals' rotation, the site's rewards and the Daily Claw.
include = [
    "bfheroes/store.toml",
    "bfheroes/deals.toml",
    "bfheroes/rewards.toml",
    "bfheroes/claw.toml",
]

# The one client string of versions 1.46 and 1.89, which their dedicated servers greet FESL with
# too. The game takes its Theater address from the Hello answer; the port is the one that its
# Settings/EABackend/GameManager.con names in a line it leaves commented out. The game is free to
# play, so no entitlement is needed to log in.
[clients.bfwest-pc]
theater_port = 18275
# A dedicated server logs in like a client, with a player's account and hero, since the game's
# account and password login does nothing (BFHeroes.exe 1.89 0x0040216f, 0x004b6e5b).
servers_log_in_as_players = true

# The host of the game's Magma web services, the default of 1.89's magmaHost and 1.46's PROD
# environment: the account layer where the game trades the session it was started with for its
# login token, the store and the website. What the game reads from it: dates to the minute in
# UTC (BFHeroes.exe 1.89 0x0069e3fe); the best single entitlement of each item of a hero,
# ignoring the others (0x007baaa6); and a refusal of a hero that a path names, reported as error
# 6011 for USER_DOES_NOT_MATCH and 6009 for NOT_NUMERIC in the field userId (0x0069def5).
[http]
magma = "www.battlefieldheroes.com"

# The game puts its lang setting at the start of the addresses of its hot deals and its in-game
# pages, where Brazilian Portuguese is br, as the launcher and the original site named it.
[http.languages]
br = "pt-BR"

# The currencies of the wallets the game loads with each hero, by code: Hero Points, Valor Points
# and Funds. The game keeps a balance in each, and its ability refund fails without the Hero Points
# one (BFHeroes.exe 1.89 0x007dc1ac). A hero earns Hero Points with its own levels, while Funds
# were one balance per account and the website read Valor Points without naming a hero, so an
# account's heroes share those two. Funds were bought with money, which this server takes none
# of, so each account starts with an allowance of this server's choosing.
[currencies._DH]
scope = "persona"
# Dedicated servers credit a round's Hero Points at its end, but a hero earns its points with its
# levels here, so theirs are recorded and credited 0 (BFHeroes.exe 1.89 0x00696ea9).
credits = { most = 0, within = 600 }

[currencies._DV]
scope = "account"
# A round's missions pay 10 to 90 Valor Points each, team awards more and a booster doubles them,
# which dedicated servers credit at the round's end (0x00696ea9).
credits = { most = 1000, within = 600 }

[currencies._PF]
scope = "account"
allowance = 2500

# Treasure chests, which a hero picks up in rounds: the dedicated server stacks them on the hero
# at the round's end, one request per hero (BFHeroes.exe 1.89 0x006963cc), and the website opened
# each with a treasure chest key of 499 Funds (June 2012), which the account held. The game has no
# definition of the key, item 7353, so it is sold on the site alone.
[chests]
tag = "BFH_TREASURE_CHEST"
# The request carries no id that would tell a repeat, so each stacks at most this many.
most = 5
key = 7353
key_price = 499
currency = "_PF"
contents = "treasure-chest"
# The numbers of keys the site sells at once, at the key's price each.
packs = [1, 3, 5]

# The codes that the website redeemed for gifts, which the admin makes: four groups of four from
# the digits 1-9 and the letters A-Z without I and O, as every code of 2010-2014 was written.
[codes]
alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZ"
groups = 4
size = 4

# The game's catalogue: its items, their names and icons, the daily missions and the XP of each
# level, which `openfesl catalogue extract` reads from a player's copy and the server imports;
# none of it ships with the server. The game loads every definition file below in one go, and
# a file decides its items' kind, while their numbers are unique across the files
# (BFHeroes.exe 1.89 0x0066290d).
[catalogue]
definitions = "mods/bfheroes/Objects/Items_server.zip"
texts = "mods/bfheroes/Localization/strings.csv"
icons = "mods/bfheroes/Menu_client.zip"
# The look, equipment, emotes and missions that a new hero of each team and kit starts with, and
# the colours of skin and hair (0x006615e6).
tables = ["DefaultCustomization.xml", "Colors.xml"]
# The 1.89 shirts with the logos of DICE and of the game, Royal and National, which only the
# admin panel shows and admins alone grant.
withheld = [257, 264, 284, 291]

# The columns of the language table; 1.46 has some others, a few of them empty.
[catalogue.languages]
ENG_US = "en"
GER_DE = "de"
FRE_FR = "fr"
ITA_IT = "it"
POL_PL = "pl"
POR_PT = "pt"
RUS_RU = "ru"
SPA_ES = "es"
TUR_TR = "tr"
DUT_NL = "nl"
POR_BR = "pt-BR"
SWE_SE = "sv"
JPN_JP = "ja"
KOR_KR = "ko"

# What the fields of a definition mean: the factions and kits as bit masks, the slot of what is
# worn, the lowest level, which 1.89 sets to 1 for every item but the missions, and the one team
# that a mission is for; the clothes marked default, which every hero they fit holds; and the
# mission to complete before a mission, and whether a mission is completed more than once.
[catalogue.fields]
factions = "faction"
classes = "kits"
slot = "slot"
level = "minLevel"
team = "teamPrereq"
base = "default"
prerequisite = "missionPrereq"
repeatable = "repeatable"

[catalogue.factions]
royal = 1
national = 2

# A mission names its team by the team's id instead, which is 0 for either team
# (DefaultCustomization.xml).
[catalogue.teams]
national = 1
royal = 2

# A mission's kit mask has a second bit for each class, for its female heroes, whom the game
# leaves out (GameLogicInit.con).
[catalogue.classes]
commando = 9
soldier = 18
gunner = 36

[catalogue.slots]
hat = 0
facial = 1
neck = 2
body = 3
jacket = 4
hands = 5
legs = 6
feet = 7
chest = 8
waist = 9
head = 10
hair = 11
facial_hair = 12

# The icons lie where the game's menu draws them from: each worn item, weapon, emote and mission
# by its number, and an ability by its first level unless it is used up, which has its own.
[[catalogue.items]]
file = "Items.xml"
kind = "appearance"
name = "WEST_Custom_Item_{id}"
icons = ["External/FlashMenu/images/items/item{id}.dds"]

[[catalogue.items]]
file = "Weapons.xml"
kind = "weapon"
name = "WEST_Custom_Item_{id}"
icons = ["HUD/Texture/Ingame/Weapons/weapon{id}.tga"]

# Each <upgrade> of an ability is one of its levels and an item of its own (0x006627a1).
[[catalogue.items]]
file = "Abilities.xml"
kind = "ability"
levels = "upgrade"
name = "WEST_Custom_Item_{id}"
icons = [
    "External/FlashMenu/images/items/citem{id}.png",
    "External/FlashMenu/images/items/ability{first}.tga",
]

[[catalogue.items]]
file = "Emotes.xml"
kind = "emote"
name = "WEST_Custom_Item_{id}"
icons = ["External/FlashMenu/images/items/emote{id}.png"]

[[catalogue.items]]
file = "Boosters.xml"
kind = "convenience"
name = "WEST_Custom_Item_{id}"
icons = [
    "External/FlashMenu/images/items/citem{id}.png",
    "External/FlashMenu/images/items/citem{id}.tga",
]

[[catalogue.items]]
file = "Missions.xml"
kind = "mission"
name = "AUTO_RULES_MISSION_{id}"
icons = ["External/FlashMenu/images/items/mission{id}.png"]

# The daily mission of each day, by the day of the year of the FESL server's clock in UTC with
# 1 January as 0, long enough for a leap year: a table of mission numbers that the game reads
# right after it checks the day's range (1.89 0x007c13b0, 1.46 0x007979da).
[catalogue.daily_missions]
after = "adjustedDayInYear < 366"
days = 366

# The XP from each level to the next, which the game sets once per level from level 0, unused,
# to 29; level 30 is the highest (1.89 0x004874e8, 1.46 0x00482c82).
[catalogue.experience]
levels = 30

# The models that the game's menu draws its heroes with, so that the site draws them alike: the
# parts that each worn item adds by layer, the scripts that create them with their meshes and
# textures, the region of each item type in the 1024 px texture into which a hero's textures are
# painted (RendDX9.dll 1.89 0x1013d871), the rules that take parts off a hero, and the skeletons
# with the animations of the menu's hero (BFHeroes.exe 1.89 0x00d88650), which play 30 frames a
# second.
[catalogue.models]
files = "mods/bfheroes/Objects/Items_client.zip"
mount = "Objects/Items"
mesh = "{folder}/meshes/{name}.skinnedmesh"
items = "Items.xml"
template = "template"
layer = "layer"
regions = "ItemSettings.con"
mesh_rules = "MeshRules.con"
# The parts of the female heroes, whose kits the game leaves out (GameLogicInit.con).
left_out = "^(bri|ger)_f_"
atlas = 1024
quality = 90
animations = "mods/bfheroes/Objects/Soldiers_server.zip"
animation_mount = "Objects/Soldiers"
frame_rate = 30
# The ramp that the menu's shader (RaShaderPortrait.fx) shades its models with: the default one,
# as the menu loads no level with its own.
warp = ["mods/bfheroes/Common_client.zip", "Textures/defaultLightWarpSkinned.dds"]
# The menu's light (SwiffPlayer.dll 1.89 0x1003ef47 sets -0.5, 0.2, 0 in the engine's space),
# with X mirrored as in the models.
light = [0.5, 0.2, 0.0]

# The colours that tint a hero's textures by overlay before they are painted (BFHeroes.exe 1.89
# 0x0047b4f8): its skin tone those of its skin up to layer 0, and its hair colour those of its
# hair, each by number from Colors.xml, or the colour that the game's customization starts with
# where the table lacks the number. The other textures keep the colour of their script.
[catalogue.models.tints]
table = "Colors.xml"
skin = { group = "skin", types = ["cit_body", "cit_legs", "cit_head", "cit_feet", "cit_hands", "cit_faceobj", "cit_neck"], highest_layer = 0, default = [155, 120, 85] }
hair = { group = "hair", types = ["cit_hair", "cit_headhair", "cit_facehair"], default = [100, 75, 55] }

# The menu's idle, the random idles of the face in rounds, the poses of item icons, and the
# emotes with which the creator's hero answers a choice: a nod to a faction, a flex to a class, a
# wave to Surprise me, and a cheer once it is created.
[catalogue.models.clips]
idle = ["idle"]
faces = ["face_rnd_idle"]
poses = ["hands", "default"]
nod = ["yes"]
flex = ["flex"]
wave = ["wave"]
cheer = ["cheer"]

# The camera and still pose of the portrait that the menu renders of its hero, fitted to the
# one the game uploads of a National hero (mugshot.png), as the values that the menu sets
# (SwiffPlayer.dll 1.89 0x1003f8ea) draw the hero larger and higher than it; the Royal camera looks
# 0.05 m higher, as the menu's does. The pose is the idle at the time that the menu sets
# (0x1003f21a), for National heroes the frame that fits the portrait best.
[catalogue.models.figures.royal]
skeleton = "british_male_soldier/british_male_soldier.ske"
systems = [
    "british_male_soldier/AnimationSystemFrontend.inc",
    "british_male_soldier/AnimationSystemIcons.inc",
    "british_male_soldier/AnimationSystem3p.inc",
]
pose = ["idle", 5.6]
camera = { look_at = [0.0, 1.024, 0.0], distance = 2.6, azimuth = 180.0, zenith = 89.9, fov = 0.882, near = 0.01, far = 20.0 }

# The National icons' system names its poses in the Royal folder, which lacks them.
[catalogue.models.figures.national]
skeleton = "german_male_soldier/german_male_soldier.ske"
systems = [
    "german_male_soldier/AnimationSystemFrontend.inc",
    "german_male_soldier/AnimationSystemIcons.inc",
    "german_male_soldier/AnimationSystem3p.inc",
]
relocated = { "british_male_soldier/animations/common/gms_uipose_default.baf" = "german_male_soldier/animations/common/gms_uipose_default.baf", "british_male_soldier/animations/common/gms_uipose_hands.baf" = "german_male_soldier/animations/common/gms_uipose_hands.baf" }
pose = ["idle", 2.3333333]
camera = { look_at = [0.0, 0.974, 0.0], distance = 2.6, azimuth = 180.5, zenith = 89.9, fov = 0.882, near = 0.01, far = 20.0 }

# How the services behave where the game handles more than one behaviour; the instance's
# settings override each.
[policies]
# A birth date is checked against the country's age limits (or: false).
registration.age_check = true
# A player old enough to register but not without a parent's consent registers (or: refuse).
registration.under_parental_age = "allow"
# A new account logs in only once the link sent to its address was opened (or: true).
accounts.email_verification = false
# A login while the account plays elsewhere signs the other game out (or: refuse).
accounts.concurrent_login = "replace"
# The oldest client version that may connect, such as "1.89"; older ones are told to update.
connect.minimum_client_version = ""
# The oldest OpenFESLHook version that may connect, such as "0.2.0"; older hooks and those
# that name no version are told to update.
connect.minimum_hook_version = ""
# Whether players are told that the service is busy. The game's dedicated servers greet FESL as
# its clients do, so they are kept out too.
connect.maintenance = false

# The game's website of autumn 2012, as the web pages draw it: the red-brown of its menus as the
# accent, lifted to read with black text, on a dark frame with red-brown boxes, green buttons,
# parchment rows and white headings. Its heading typeface is not free, so one that the pages ship
# takes its place.
[theme]
font = "Barlow"
accent = "#C8673A"
accent_hover = "#D98763"
menu_current = "#521F1C"
badge = "#77813B"
badge_edge = "#4F5627"
field = "#262626"
mottle = "#D7C8AF"
grit = "#F1E9DE"
panel = "rgba(82, 31, 28, 0.82)"
panel_edge = "#B9453E"
row = "#D7C8AF"
row_alt = "#C5BBA7"
row_light = "#F1E9DE"
score_row = "#C4BAA6"
score_row_alt = "#C9C099"
subtitle = "#141414"
bright = "#F8F4EF"
soft = "#DDDDDD"

# The game's website of autumn 2012, whose site container, header and menus the pages wear over
# a painted sky. Its menus list the game's pages under the headings the site gave them, and its
# header bar shows the account's Funds and Valor Points, which every hero of the account shares.
# The game opens two of its addresses in the system browser (SwiffPlayer.dll 1.89): the creator,
# when the account has no hero, and the Funds page, which 1.46 names purchaseBattlefunds. The
# Funds page keeps the website's address, under the store's own.
[site]
host = "www.battlefieldheroes.com"
addresses = { "/user/createHero" = "/user/createHero?from=game", "/store/purchaseFunds" = "/store/purchaseFunds?from=game", "/store/purchaseBattlefunds" = "/store/purchaseFunds?from=game" }
paths = { hot-deals = "/store/hot-deals", funds = "/store/purchaseFunds", redeem = "/store/redeem" }
wallets = [
    { currency = "_PF", glyph = "coin", fill = "#F2C12E", ink = "#0A0A0A" },
    { currency = "_DV", glyph = "valor", fill = "#B9453E", ink = "#FFFFFF" },
]
# OpenFESLHook's launcher opens the site's start links, openfesl-bfheroes://launch?role=play&code=,
# once a copy of the game was allowed to open them.
start_links = true
# The front page offers each faction's deal of the day, as the 2012 front page did.
front_deals = "daily"

[[site.menus]]
name = "game"
pages = ["play", "leaderboards", "host"]

# The players' community: the player search, the accounts' friends and the rewards they claim.
[[site.menus]]
name = "community"
pages = ["search", "friends", "rewards"]

# The store, its hot deals, the treasure chests, the Daily Claw, the redeeming of codes and the
# Funds, which every visitor sees; the store's item pages lie under its address.
[[site.menus]]
name = "store"
pages = ["store", "hot-deals", "treasure-chests", "claw", "redeem", "funds"]
section = "/store"

# Heroes, which the game creates none of: with no hero it opens the website's creator and quits.
# The website made a hero as a persona with the stats the game reads at its login: its faction's
# team and its class's kit, its skin tone and hair colour by number, its hair and facial hair by
# item number, 0 for none, the clothes, equipment bar and emotes of its faction and class from
# DefaultCustomization.xml, and level 1, which the dedicated servers add levels to
# (BFHeroes.exe 1.89 0x006add86 refuses level 0). The creator of autumn 2012 chose no face, so the
# face type stays 0. The game grants itself every item of those lists but the consumables
# (0x007b9deb), so the site grants the bandages, with uses of this server's choosing. Every account
# has 4 hero slots, and names are 2 to 16 letters, digits, _ or -, unique ignoring capitals.
[heroes]
slots = 4
# The hyphen is escaped, as browsers read a pattern attribute in the v mode that requires it.
name = "[A-Za-z0-9_\\-]{2,16}"
name_length = [2, 16]
# The 2012 colours of the skin tones, darkest first, and of the hair colours, listed in the
# creator's own orders.
skin_tones = ["#2E2017", "#682800", "#8A4A00", "#AC5C00", "#CC7820", "#EC8212", "#EA943C", "#FEBE7C", "#F8D6B2"]
skin_order = [9, 8, 7, 6, 5, 4, 3, 2, 1]
hair_colours = ["#F8E5B2", "#8E664A", "#FF7352", "#2E2017", "#C59D81"]
hair_order = [1, 3, 5, 2, 4]
stats = { faction = "c_team", class = "c_kit", skin_tone = "c_skc", hair_colour = "c_hrc", hair_style = "c_hrs", facial_hair = "c_fhrs", appearance = "c_apr", equipment = "c_eqp", emotes = "c_emo", level = "level", xp = "xp", completed = "aw{id}", daily_completed = "cdm" }
starting_stats = { c_ft = 0, level = 1 }
starting_items = { "2005-lmct" = 10 }
# The stats that the game writes itself, each set for all time: its hero's look, equipment bar and
# emotes as item numbers joined by semicolons, the look as 0 when empty; the mission it wishes for
# in each of the hero's three mission slots; the mission completed in a slot, which it only clears
# once shown; a number its mission manager keeps; and its account's tutorial status, 0 to 2, and
# the start and length of its last session (BFHeroes.exe 1.89 0x007b11a6, 0x007c2169, 0x00683d63).
# Its dedicated servers check the look and equipment against the item definitions again
# (0x007b98a7).
written = [
    { keys = "c_apr", items = ["appearance"], listed = true },
    { keys = "c_eqp", items = ["weapon", "ability"], listed = true },
    { keys = "c_emo", items = ["emote"], listed = true },
    { keys = "c_wmid[0-2]", items = ["mission"] },
    { keys = "c_cmid[0-2]" },
    { keys = "c_tut", highest = 2 },
    { keys = "c_ltp|c_ltm|c_slm", highest = 4294967295 },
]
# The game grants each hero itself every mission of its team and class whose level the hero has
# reached (0x007ba79f).
granted = ["mission"]
# The highest level, which the game's rank table ends with (1.89 0x006add86 clamps to it), so a
# level a server pushes past it stays at it. The Hero Points each hero earns with its levels, one
# on each even level as the original service gave them, and the uses or days left at which the
# heroes page and the in-game store say an item runs low. The game announces the points that a
# level-up brings (BFHeroes.exe 1.89 0x004e543e), but the code that levels heroes up and grants
# them is not part of it, so this server grants them as the level changes.
highest_level = 30
points = "_DH"
points_every = 2
running_low = 5
running_low_days = 3
# Further hero slots and new names cost Funds, the currency of the account; renames follow the
# rule of new names, and a bought slot stays with the account.
currency = "_PF"
rename_price = 1499
slot_price = 1749

# The stats that a hero's public profile shows, as the 2012 site did: the keys of the game's stats
# dictionary (BFHeroes.exe 1.89 0x006aa1fb) that its dedicated servers add to at the end of each
# round (python/bf2/stats/stats.py), every one kept for all time and the weekly ones by week too.
[heroes.profile]
rating = "elo"
kills = "ki"
deaths = "dt"
hits = "hi"
shots = "fi"
suicides = "su"
score = "rs"
wins = "win"
losses = "los"
captures = "cpc"
rocket_captures = "rc"
time = "ct"
games = "games"
# The mission in each of the hero's three mission slots, 0 for none.
current = ["mid0", "mid1", "mid2"]
# The time a hero plays in a leaderboard's period before the board lists it: 2 hours, as the 2012
# site said.
listed_after = 7200

# The prestige rank, which the servers pack as the rotation times 256 plus the level, from level 10
# on (Settings/RankSettings.con); the site named the level and wrote the rotation as a numeral.
[heroes.profile.rank]
key = "prs"
level = "Player_Prestige_Level_{n}"
rotation = "Player_Prestige_Rotation_{n}"
levels = 13
rotations = 100

# Each weapon or ability that the hero used, by its item number: the time used, kills, deaths
# while using it, and shots that hit of those fired.
[heroes.profile.weapons]
keys = { time = "tw{id}", kills = "kw{id}", deaths = "dww{id}", hits = "hw{id}", shots = "sw{id}" }

# The weapons that killed the hero, by item number.
[heroes.profile.foes]
keys = { deaths = "dfw{id}" }

# Each map by the number the servers count it under (python/bf2/stats/constants.py, levelsTypeMap),
# its night variant under the same one, with the name of its main level.
[heroes.profile.maps]
keys = { time = "m_ct{id}", wins = "m_win{id}", losses = "m_los{id}" }
names = { 0 = "WEST_LEVELNAME_VILLAGE", 1 = "WEST_LEVELNAME_SEASIDE_SKIRMISH", 2 = "WEST_LEVELNAME_river", 3 = "WEST_LEVELNAME_LAKE", 4 = "WEST_LEVELNAME_Mayhem", 5 = "WEST_LEVELNAME_Smack2", 6 = "WEST_LEVELNAME_HEAT", 9 = "WEST_LEVELNAME_ruin", 10 = "WEST_LEVELNAME_woodlands", 11 = "WEST_LEVELNAME_wicked_wake", 12 = "WEST_LEVELNAME_Royal_Rumble", 13 = "WEST_LEVELNAME_Lunar" }

# The jeep, tank and plane: time inside, kills, kills by running into foes (road kills, tank
# smashes and wing clips), vehicles destroyed, deaths from it and deaths inside it.
[heroes.profile.vehicles]
keys = { time = "tv{id}", kills = "kv{id}", collisions = "kvr{id}", destroyed = "dstrv{id}", deaths = "dfv{id}", inside = "div{id}" }
names = { 0 = "jeep", 1 = "tank", 2 = "plane" }

# The heroic moments by their in-game event ids (BFHeroes.exe 1.89 0x004842a1), each named by the
# text the site showed; 4, 24 and 25 have none.
[heroes.profile.moments]
keys = { count = "ige{id}" }
