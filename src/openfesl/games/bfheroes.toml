name = "Battlefield Heroes"
# The game's executable, next to which OpenFESLHook goes; started with +dedicated, the same
# executable is the game's dedicated server.
executable = "BFHeroes.exe"
# The game's Plasma partition and persona namespace are kept on EA's servers, not in the client,
# which only reads the partition back from the Hello answer; these are the ones the game was
# played with live on OpenFESL.
partition = "/eagames/bfwest"
namespace = "bfwest"
# The web pages the game's menu shows beside its front page: the guide to playing. The server list
# is drawn for games with squads and a server browser that finds servers by name, and the
# leaderboard for other stats than this game's, so neither is listed.
pages = ["play"]
# The stats of the player's account rather than of a hero: the tutorial, the last session and its
# length, the daily missions and the pop-item counts. The game's stats dictionary gives each key its
# owner, yet it names a hero and an account by the same owner type, telling them apart by the id
# alone (BFHeroes.exe 1.89 0x006aa1fb).
account_stats = ["c_tut", "c_ltm", "c_slm", "cdm", "edm", "dmc", "pi[0-9]+"]

# The one client string of versions 1.46 and 1.89, which their dedicated servers greet FESL with
# too. The game takes its Theater address from the Hello answer; the port is the one that its
# Settings/EABackend/GameManager.con names in a line it leaves commented out. The game is free to
# play, so no entitlement is needed to log in.
[clients.bfwest-pc]
theater_port = 18275
# A dedicated server logs in like a client, with a player's account and hero, since the game's
# account and password login does nothing (BFHeroes.exe 1.89 0x0040216f, 0x004b6e5b).
servers_log_in_as_players = true

# The host of the game's Magma web services, the default of 1.89's magmaHost and 1.46's PROD
# environment: the account layer where the game trades the session it was started with for its
# login token, the store and the website. What the game reads from it: dates to the minute in
# UTC (BFHeroes.exe 1.89 0x0069e3fe); the best single entitlement of each item of a hero,
# ignoring the others (0x007baaa6); and a refusal of a hero that a path names, reported as error
# 6011 for USER_DOES_NOT_MATCH and 6009 for NOT_NUMERIC in the field userId (0x0069def5).
[http]
magma = "www.battlefieldheroes.com"

# The currencies of the wallets the game loads with each hero, by code: Hero Points, Valor Points
# and Funds. The game keeps a balance in each, and its ability refund fails without the Hero Points
# one (BFHeroes.exe 1.89 0x007dc1ac). A hero earns Hero Points with its own levels, while Funds
# were one balance per account and the website read Valor Points without naming a hero, so an
# account's heroes share those two. Funds were bought with money, which this server takes none
# of, so each account starts with an allowance of this server's choosing.
[currencies._DH]
scope = "persona"

[currencies._DV]
scope = "account"

[currencies._PF]
scope = "account"
allowance = 2500

# The game's catalogue: its items, their names and icons, the daily missions and the XP of each
# level, which `openfesl catalogue extract` reads from a player's copy and the server imports;
# none of it ships with the server. The game loads every definition file below in one go, and
# a file decides its items' kind, while their numbers are unique across the files
# (BFHeroes.exe 1.89 0x0066290d).
[catalogue]
definitions = "mods/bfheroes/Objects/Items_server.zip"
texts = "mods/bfheroes/Localization/strings.csv"
icons = "mods/bfheroes/Menu_client.zip"
# The look, equipment, emotes and missions that a new hero of each team and kit starts with, and
# the colours of skin and hair (0x006615e6).
tables = ["DefaultCustomization.xml", "Colors.xml"]

# The columns of the language table; 1.46 has some others, a few of them empty.
[catalogue.languages]
ENG_US = "en"
GER_DE = "de"
FRE_FR = "fr"
ITA_IT = "it"
POL_PL = "pl"
POR_PT = "pt"
RUS_RU = "ru"
SPA_ES = "es"
TUR_TR = "tr"
DUT_NL = "nl"
POR_BR = "pt-BR"
SWE_SE = "sv"
JPN_JP = "ja"
KOR_KR = "ko"

# What the fields of a definition mean: the factions and kits as bit masks, the slot of what is
# worn, the lowest level, which 1.89 sets to 1 for every item but the missions, and the one team
# that a mission is for.
[catalogue.fields]
factions = "faction"
classes = "kits"
slot = "slot"
level = "minLevel"
team = "teamPrereq"

[catalogue.factions]
royal = 1
national = 2

# A mission names its team by the team's id instead, which is 0 for either team
# (DefaultCustomization.xml).
[catalogue.teams]
national = 1
royal = 2

# A mission's kit mask has a second bit for each class, for its female heroes, whom the game
# leaves out (GameLogicInit.con).
[catalogue.classes]
commando = 9
soldier = 18
gunner = 36

[catalogue.slots]
hat = 0
facial = 1
neck = 2
body = 3
jacket = 4
hands = 5
legs = 6
feet = 7
chest = 8
waist = 9
head = 10
hair = 11
facial_hair = 12

# The icons lie where the game's menu draws them from: each worn item, weapon, emote and mission
# by its number, and an ability by its first level unless it is used up, which has its own.
[[catalogue.items]]
file = "Items.xml"
kind = "appearance"
name = "WEST_Custom_Item_{id}"
icons = ["External/FlashMenu/images/items/item{id}.dds"]

[[catalogue.items]]
file = "Weapons.xml"
kind = "weapon"
name = "WEST_Custom_Item_{id}"
icons = ["HUD/Texture/Ingame/Weapons/weapon{id}.tga"]

# Each <upgrade> of an ability is one of its levels and an item of its own (0x006627a1).
[[catalogue.items]]
file = "Abilities.xml"
kind = "ability"
levels = "upgrade"
name = "WEST_Custom_Item_{id}"
icons = [
    "External/FlashMenu/images/items/citem{id}.png",
    "External/FlashMenu/images/items/ability{first}.tga",
]

[[catalogue.items]]
file = "Emotes.xml"
kind = "emote"
name = "WEST_Custom_Item_{id}"
icons = ["External/FlashMenu/images/items/emote{id}.png"]

[[catalogue.items]]
file = "Boosters.xml"
kind = "convenience"
name = "WEST_Custom_Item_{id}"
icons = [
    "External/FlashMenu/images/items/citem{id}.png",
    "External/FlashMenu/images/items/citem{id}.tga",
]

[[catalogue.items]]
file = "Missions.xml"
kind = "mission"
name = "AUTO_RULES_MISSION_{id}"
icons = ["External/FlashMenu/images/items/mission{id}.png"]

# The daily mission of each day, by the day of the year of the FESL server's clock in UTC with
# 1 January as 0, long enough for a leap year: a table of mission numbers that the game reads
# right after it checks the day's range (1.89 0x007c13b0, 1.46 0x007979da).
[catalogue.daily_missions]
after = "adjustedDayInYear < 366"
days = 366

# The XP from each level to the next, which the game sets once per level from level 0, unused,
# to 29; level 30 is the highest (1.89 0x004874e8, 1.46 0x00482c82).
[catalogue.experience]
levels = 30

# How the services behave where the game handles more than one behaviour; the instance's
# settings override each.
[policies]
# A birth date is checked against the country's age limits (or: false).
registration.age_check = true
# A player old enough to register but not without a parent's consent registers (or: refuse).
registration.under_parental_age = "allow"
# A new account logs in only once the link sent to its address was opened (or: true).
accounts.email_verification = false
# A login while the account plays elsewhere signs the other game out (or: refuse).
accounts.concurrent_login = "replace"
# The oldest client version that may connect, such as "1.89"; older ones are told to update.
connect.minimum_client_version = ""
# The oldest OpenFESLHook version that may connect, such as "0.2.0"; older hooks and those
# that name no version are told to update.
connect.minimum_hook_version = ""
# Whether players are told that the service is busy. The game's dedicated servers greet FESL as
# its clients do, so they are kept out too.
connect.maintenance = false

# The game's website of autumn 2012, as the web pages draw it: the red-brown of its menus as the
# accent, lifted to read with black text, on a dark frame with red-brown boxes, green buttons,
# parchment rows and white headings. Its heading typeface is not free, so one that the pages ship
# takes its place.
[theme]
font = "Barlow"
accent = "#C8673A"
accent_hover = "#D98763"
menu_current = "#521F1C"
badge = "#77813B"
badge_edge = "#4F5627"
field = "#262626"
mottle = "#D7C8AF"
grit = "#F1E9DE"
panel = "rgba(82, 31, 28, 0.82)"
panel_edge = "#B9453E"
row = "#D7C8AF"
row_alt = "#C5BBA7"
row_light = "#F1E9DE"
score_row = "#C4BAA6"
score_row_alt = "#C9C099"
subtitle = "#141414"
bright = "#F8F4EF"
soft = "#DDDDDD"

# The game's website of autumn 2012, whose site container, header and menus the pages wear over
# a painted sky. Its menus list the game's pages under the headings the site gave them, and its
# header bar shows the account's Funds and Valor Points, which every hero of the account shares.
# The game opens two of its addresses in the system browser (SwiffPlayer.dll 1.89): the creator,
# when the account has no hero, and the Funds page, which 1.46 names purchaseBattlefunds.
[site]
host = "www.battlefieldheroes.com"
addresses = { "/user/createHero" = "/user/createHero?from=game" }
wallets = [
    { currency = "_PF", glyph = "coin", fill = "#F2C12E", ink = "#0A0A0A" },
    { currency = "_DV", glyph = "valor", fill = "#B9453E", ink = "#FFFFFF" },
]

[[site.menus]]
name = "game"
pages = ["play", "leaderboard", "host"]

# Heroes, which the game creates none of: with no hero it opens the website's creator and quits.
# The website made a hero as a persona with the stats the game reads at its login: its faction's
# team and its class's kit, its skin tone and hair colour by number, its hair and facial hair by
# item number, 0 for none, the clothes, equipment bar and emotes of its faction and class from
# DefaultCustomization.xml, and level 1, which the dedicated servers add levels to
# (BFHeroes.exe 1.89 0x006add86 refuses level 0). The creator of autumn 2012 chose no face, so the
# face type stays 0. The game grants itself every item of those lists but the consumables
# (0x007b9deb), so the site grants the bandages, with uses of this server's choosing. Every account
# has 4 hero slots, and names are 2 to 16 letters, digits, _ or -, unique ignoring capitals.
[heroes]
slots = 4
# The hyphen is escaped, as browsers read a pattern attribute in the v mode that requires it.
name = "[A-Za-z0-9_\\-]{2,16}"
name_length = [2, 16]
# The 2012 colours of the skin tones, darkest first, and of the hair colours, listed in the
# creator's own orders.
skin_tones = ["#2E2017", "#682800", "#8A4A00", "#AC5C00", "#CC7820", "#EC8212", "#EA943C", "#FEBE7C", "#F8D6B2"]
skin_order = [9, 8, 7, 6, 5, 4, 3, 2, 1]
hair_colours = ["#F8E5B2", "#8E664A", "#FF7352", "#2E2017", "#C59D81"]
hair_order = [1, 3, 5, 2, 4]
stats = { faction = "c_team", class = "c_kit", skin_tone = "c_skc", hair_colour = "c_hrc", hair_style = "c_hrs", facial_hair = "c_fhrs", appearance = "c_apr", equipment = "c_eqp", emotes = "c_emo", level = "level", xp = "xp" }
starting_stats = { c_ft = 0, level = 1 }
starting_items = { "2005-lmct" = 10 }
# The Hero Points each hero earns with its levels, and the uses left at which the heroes page says
# an item runs low.
points = "_DH"
running_low = 3

# Royal Army first, as the 2012 creator listed them.
[heroes.factions.royal]
team = 2
hair_styles = [82, 83, 84, 85, 86, 87]
facial_hair = [102, 103, 104, 105, 106, 107, 108, 109]
colour = "#24508F"
ink = "#F2C12E"
glyph = "crown"

[heroes.factions.national]
team = 1
hair_styles = [120, 121, 122, 123, 124, 125]
facial_hair = [126, 127, 128, 129, 130, 131, 132, 133]
colour = "#A3221B"
ink = "#FFFFFF"
glyph = "chevrons"

[heroes.classes]
commando = { kit = 0, glyph = "reticle" }
soldier = { kit = 1, glyph = "heart-cross" }
gunner = { kit = 2, glyph = "shield-bars" }

[heroes.loadouts.royal]
commando = { appearance = [4, 5, 32, 29], equipment = [3001, 3013, 2136, 3156, 2005], emotes = [5000, 5007, 5016] }
soldier = { appearance = [4, 936, 935, 29], equipment = [3011, 3009, 2075, 3156, 2005], emotes = [5000, 5007, 5016] }
gunner = { appearance = [4, 36, 444, 29], equipment = [3003, 3009, 2026, 3156, 2005], emotes = [5000, 5007, 5016] }

[heroes.loadouts.national]
commando = { appearance = [10, 981, 979, 56], equipment = [3002, 3014, 2141, 3155, 2005], emotes = [5000, 5007, 5016] }
soldier = { appearance = [10, 980, 978, 56], equipment = [3012, 3010, 2075, 3155, 2005], emotes = [5000, 5007, 5016] }
gunner = { appearance = [10, 73, 9, 56], equipment = [3004, 3010, 2026, 3155, 2005], emotes = [5000, 5007, 5016] }

# The Theater lobby the dedicated servers list their games in. Lobbies are kept on EA's servers,
# not in the client, and a dedicated server asks for any (LID -1); this is the one the game was
# played with live on OpenFESL.
[[lobbies]]
id = 1
name = "bfwestPC01"
locale = "en_US"
max_games = 10000
