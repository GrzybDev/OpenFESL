# The 2012 site's leaderboards by their addresses, each with the stat it ranks heroes by, or the
# stat that it divides by another: score, kills per death, wins per loss, time played, accuracy and
# flags. Each also comes for one faction or class, as royal-score.
[heroes.profile.boards]
score = ["score"]
kills-deaths = ["kills", "deaths"]
wins-losses = ["wins", "losses"]
time-played = ["time"]
hit-fired = ["hits", "shots"]
capture-points = ["captures"]

